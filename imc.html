<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f7fc;
            color: #3b3054;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-weight: normal;
            font-size: 24px;
        }

        .weight-toggle {
            display: inline-flex;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .weight-toggle button {
            background-color: #e6e1f5;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 5px;
            cursor: pointer;
            color: #3b3054;
        }

        .weight-toggle button.active {
            background-color: #8a63d2;
            color: white;
        }

        .input-group {
            margin: 20px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input {
            width: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }

        .weight-display {
            font-size: 48px;
            margin: 20px 0;
            color: #3b3054;
        }

        .imc-box {
            border: 1px solid #e6e1f5;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            background-color: white;
            text-align: left;
            display: inline-block;
            width: 80%;
            max-width: 400px;
        }

        .imc-box p {
            margin: 10px 0;
        }

        .imc-box .title {
            font-weight: bold;
        }

        .btn-next {
            background-color: #8a63d2;
            border: none;
            border-radius: 30px;
            padding: 15px 30px;
            font-size: 16px;
            color: white;
            cursor: pointer;
            margin-top: 30px;
        }

        .btn-next:hover {
            background-color: #7149ac;
        }
    </style>
</head>
<body>

    <h1>¿Cuál es tu peso actual?</h1>

    <div class="weight-toggle">
        <button class="active" onclick="setUnit('kg')">kg</button>
        <button onclick="setUnit('lb')">lb</button>
    </div>

    <div class="input-group">
        <label for="weight">Peso (en <span id="weight-unit">kg</span>):</label>
        <input type="number" id="weight" placeholder="120" value="120">
    </div>

    <div class="input-group">
        <label for="height">Altura (en metros):</label>
        <input type="number" id="height" placeholder="1.75" value="1.75" step="0.01">
    </div>

    <button class="btn-next" onclick="calculateIMC()">Calcular IMC</button>

    <div class="weight-display" id="weight-display">120 kg</div>

    <div class="imc-box" id="imc-result">
        <!-- O resultado do IMC será exibido aqui -->
    </div>

    <script>
        let unit = 'kg';

        function setUnit(newUnit) {
            unit = newUnit;
            document.getElementById('weight-unit').innerText = newUnit;
            updateDisplay();
        }

        function calculateIMC() {
            const weight = parseFloat(document.getElementById("weight").value);
            const height = parseFloat(document.getElementById("height").value);
            let imc;

            if (unit === 'lb') {
                imc = (weight / 2.20462) / (height * height);
            } else {
                imc = weight / (height * height);
            }

            imc = imc.toFixed(2);
            let resultText = `Tu IMC es de ${imc}, lo que se considera `;

            if (imc < 18.5) {
                resultText += "bajo peso.";
            } else if (imc < 24.9) {
                resultText += "normal.";
            } else if (imc < 29.9) {
                resultText += "sobrepeso.";
            } else {
                resultText += "obesidad.";
            }

            document.getElementById("imc-result").innerHTML = `
                <p class="title">${resultText}</p>
                <p>Mantente positiva y céntrate en una dieta equilibrada y el ejercicio.</p>
                <p>Utilizaremos tu índice para personalizar tu plan efectivo de pérdida de peso.</p>
            `;
        }

        function updateDisplay() {
            const weight = document.getElementById('weight').value;
            document.getElementById('weight-display').innerText = `${weight} ${unit}`;
        }
    </script>

</body>
</html>
